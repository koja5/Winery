<p-toast></p-toast>
<form [formGroup]="form" class="password-container" (ngSubmit)="submit()">
  <div class="grid grid-cols-1 gap-3 mb-4">
    <p-floatlabel variant="on">
      <input pInputText id="currentPassword" type="password" formControlName="currentPassword" class="w-full" />
      <label for="currentPassword">{{ 'accountSettings.changePassword.current' | translate }}</label>
    </p-floatlabel>

    <p-floatlabel variant="on">
      <input pInputText id="newPassword" type="password" formControlName="newPassword" class="w-full" />
      <label for="newPassword">{{ 'accountSettings.changePassword.new' | translate }}</label>
    </p-floatlabel>

    <p-floatlabel variant="on">
      <input pInputText id="confirmPassword" type="password" formControlName="confirmPassword" class="w-full" />
      <label for="confirmPassword">{{ 'accountSettings.changePassword.confirm' | translate }}</label>
    </p-floatlabel>
  </div>

  <div class="flex justify-end">
    <p-button type="submit" [label]="'accountSettings.changePassword.submit' | translate" icon="pi pi-key"></p-button>
  </div>
</form>
