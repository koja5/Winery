<div class="auth-header">
  <h2>{{ 'auth.forgotPassword.title' | translate }}</h2>
  <p>{{ 'auth.forgotPassword.subtitle' | translate }}</p>
</div>

<form [formGroup]="form" (ngSubmit)="submit()">
  <div class="auth-field">
    <label for="email">{{ 'auth.field.email' | translate }}</label>
    <div class="auth-field__control" [class.is__invalid-input]="form.get('email')?.invalid && form.get('email')?.touched">
      <i class="pi pi-envelope auth-field__icon"></i>
      <input id="email" type="text" formControlName="email" autocomplete="email" placeholder="ime@primer.com" />
    </div>
  </div>

  @if (message) {
    <div class="responsive-message" [class.is__invalid-success]="message.type === 'success'" [class.is__invalid-error]="message.type === 'error'">
      {{ message.text | translate }}
    </div>
  }

  <div class="auth-actions">
    <app-button type="submit" impact="bold" tone="primary" shape="rounded" size="medium" [loading]="loading">
      {{ 'auth.forgotPassword.submit' | translate }}
    </app-button>
    <app-button type="button" routerLink="/auth/sign-in" impact="bold" tone="light" shape="rounded" size="medium">
      {{ 'general.cancel' | translate }}
    </app-button>
  </div>
</form>
