<div class="relative bg-background">
  <!-- Gornji navigacioni meni — samo za desktop -->
  <div class="mx-auto px-5 hidden md:flex">
    <div class="grid w-full grid-cols-3 items-center py-3.5">
      <div class="flex items-center"></div>

      <!-- Centar: globalna pretraga -->
      <div class="flex items-center justify-center">
        <app-global-search></app-global-search>
      </div>

      <!-- Desna strana: zvono + profile meni -->
      <div class="ml-auto flex items-center gap-2">
        <app-notification-bell></app-notification-bell>
        <button
          type="button"
          class="navbar__icon-btn flex h-9 w-9 items-center justify-center rounded-lg text-muted-foreground transition-colors hover:bg-card hover:text-foreground"
          (click)="theme.toggle()">
          <i class="pi" [class.pi-moon]="theme.theme() === 'light'" [class.pi-sun]="theme.theme() === 'dark'"></i>
        </button>
        <app-profile-menu></app-profile-menu>
      </div>
    </div>
  </div>

  <!-- Donji navigacioni meni — samo za mobilne -->
  <div class="mobile-navbar fixed bottom-0 left-0 right-0 z-50 flex h-16 border-t bg-background md:hidden">
    <button routerLink="/dashboard" routerLinkActive="text-primary" class="nav-btn flex h-full flex-1 items-center justify-center">
      <i class="pi pi-th-large text-xl"></i>
    </button>

    <button routerLink="/podrum/berba/prijem" routerLinkActive="text-primary" class="nav-btn flex h-full flex-1 items-center justify-center">
      <i class="pi pi-sun text-xl"></i>
    </button>

    <div class="flex h-full flex-1 items-center justify-center">
      <app-global-search></app-global-search>
    </div>

    <div class="flex h-full flex-1 items-center justify-center">
      <app-notification-bell></app-notification-bell>
    </div>

    <button (click)="menuService.toggleMobileMenu()" class="nav-btn flex h-full flex-1 items-center justify-center text-muted-foreground">
      <i class="pi pi-bars text-xl"></i>
    </button>
  </div>
</div>
