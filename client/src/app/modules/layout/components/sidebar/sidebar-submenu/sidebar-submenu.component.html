<div class="max-h-0 overflow-hidden pt-0.5 pl-4 transition-all duration-500" [ngClass]="{ hidden: !menuService.showSidebar(), 'max-h-screen': expanded }">
  <ul class="flex flex-col border-l border-border/50 pl-2 text-muted-foreground gap-0.5 pb-1">
    <li *ngFor="let sub of submenu.children">
      <a
        *ngIf="!sub.locked"
        [routerLink]="sub.route"
        routerLinkActive="text-primary font-semibold bg-primary/8"
        [routerLinkActiveOptions]="{ exact: true }"
        class="inline-flex w-full items-center rounded-md px-3 py-2 text-sm font-medium transition-colors duration-150 hover:bg-muted hover:text-foreground"
      >
        <span class="mr-2.5 h-1.5 w-1.5 rounded-full bg-muted-foreground/30 flex-shrink-0 transition-colors duration-150"></span>
        {{ sub.title | translate }}
      </a>
      <a
        *ngIf="sub.locked"
        [routerLink]="'/uskoro'"
        [queryParams]="{ from: sub.title }"
        class="inline-flex w-full cursor-pointer items-center rounded-md px-3 py-2 text-sm font-medium text-muted-foreground/50 transition-colors duration-150 hover:bg-muted/50"
      >
        <span class="mr-2.5 h-1.5 w-1.5 rounded-full bg-muted-foreground/20 flex-shrink-0"></span>
        <span class="flex-1">{{ sub.title | translate }}</span>
        <span class="inline-flex items-center gap-0.5 rounded-full bg-primary/10 px-1.5 py-0.5 text-[9px] font-bold uppercase tracking-wider text-primary ring-1 ring-primary/20">
          <i class="pi pi-lock" style="font-size: 8px"></i>
          {{ 'nav.locked' | translate }}
        </span>
      </a>
    </li>
  </ul>
</div>
