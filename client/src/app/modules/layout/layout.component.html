<div class="layout">
  <app-sidebar></app-sidebar>
  <div class="layout__main">
    <app-navbar></app-navbar>
    <div class="layout__content">
      <router-outlet></router-outlet>
    </div>
    <app-footer></app-footer>
  </div>

  <!-- Mobilni meni overlay (donja navigaciona traka -> dugme "meni") -->
  @if (menuService.showMobileMenu()) {
    <div class="mobile-menu-overlay" (click)="menuService.toggleMobileMenu()">
      <div class="mobile-menu-panel" (click)="$event.stopPropagation()">
        <div class="mobile-menu-panel__header">
          <span>Meni</span>
          <button type="button" (click)="menuService.toggleMobileMenu()">
            <i class="pi pi-times"></i>
          </button>
        </div>
        <app-sidebar-menu></app-sidebar-menu>
      </div>
    </div>
  }
</div>
